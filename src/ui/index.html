<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>管理 · doubao-translate2api</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script type="module" src="/admin/assets/admin.js"></script>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="brand-icon"><i data-lucide="languages"></i></span><span>doubao-translate2api</span></div>
    <div id="user-actions" hidden><span class="session-label"><span class="status-dot"></span>管理会话</span><button id="logout" class="icon-button" title="退出登录" aria-label="退出登录"><i data-lucide="log-out"></i></button></div>
  </header>
  <main id="login-screen" class="login-screen">
    <form id="login-form" class="login-form">
      <span class="login-mark"><i data-lucide="shield-check"></i></span>
      <h1>管理登录</h1>
      <label for="login-password">管理密码</label>
      <div class="password-input"><input id="login-password" type="password" required autocomplete="current-password" maxlength="256"><button type="button" class="icon-button" data-reveal="login-password" aria-label="显示密码" title="显示密码"><i data-lucide="eye"></i></button></div>
      <p id="login-error" class="form-error" role="alert"></p>
      <button id="login-submit" class="button primary" type="submit"><span>登录</span><i data-lucide="arrow-right"></i></button>
    </form>
  </main>
  <main id="dashboard" class="dashboard" hidden>
    <div class="page-heading"><div><div class="eyebrow">管理控制台</div><h1>Cookie 与连接</h1></div><div class="heading-actions"><button id="refresh" class="icon-button" title="刷新列表" aria-label="刷新列表"><i data-lucide="refresh-cw"></i></button><button id="add-account" class="button primary"><i data-lucide="plus"></i><span>导入 Cookie</span></button></div></div>
    <div class="tabs" role="tablist" aria-label="管理视图">
      <button id="cookies-tab" role="tab" aria-selected="true" aria-controls="cookies-panel" class="tab active"><i data-lucide="key-round"></i>Cookie 池<span id="account-count" class="count">0</span></button>
      <button id="security-tab" role="tab" aria-selected="false" aria-controls="security-panel" class="tab" tabindex="-1"><i data-lucide="lock-keyhole"></i>安全设置</button>
    </div>
    <section id="cookies-panel" role="tabpanel" aria-labelledby="cookies-tab">
      <div class="routing">
        <div><label class="section-label">调度方式</label><div class="segmented" role="radiogroup" aria-label="调度方式">
          <label><input type="radio" name="mode" value="failover"><span><i data-lucide="shield-check"></i>故障切换</span></label>
          <label><input type="radio" name="mode" value="round-robin"><span><i data-lucide="repeat-2"></i>轮询</span></label>
          <label><input type="radio" name="mode" value="manual"><span><i data-lucide="pin"></i>固定账号</span></label>
        </div></div>
        <div id="preferred-field" class="preferred"><label for="preferred-account" class="section-label">优先账号</label><select id="preferred-account"></select></div>
      </div>
      <div class="list-heading"><h2>已保存的 Cookie</h2><span id="enabled-count"></span></div>
      <div id="accounts" class="account-list" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden><i data-lucide="key-round"></i><p>暂无 Cookie</p><button class="button" id="empty-add">导入 Cookie</button></div>
      <div class="connection">
        <div><h2>连接地址</h2><span class="mono" id="base-url"></span></div><button id="copy-base" class="icon-button" title="复制 Base URL" aria-label="复制 Base URL"><i data-lucide="copy"></i></button>
      </div>
      <div class="models"><span class="section-label">模型</span><code>doubao-ai</code><code>volcengine-translate</code><code>microsoft-translator</code></div>
    </section>
    <section id="security-panel" role="tabpanel" aria-labelledby="security-tab" hidden>
      <div class="security-heading"><h2>修改管理密码</h2><span class="badge neutral"><i data-lucide="shield"></i>管理页专用</span></div>
      <form id="password-form" class="security-form">
        <label for="current-password">当前密码</label>
        <div class="password-input"><input id="current-password" type="password" required maxlength="256" autocomplete="current-password"><button type="button" class="icon-button" data-reveal="current-password" title="显示密码" aria-label="显示密码"><i data-lucide="eye"></i></button></div>
        <div class="label-row"><label for="new-password">新密码</label><button id="generate-password" type="button" class="text-button"><i data-lucide="sparkles"></i>随机生成</button></div>
        <div class="password-input"><input id="new-password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"><button type="button" class="icon-button" data-reveal="new-password" title="显示密码" aria-label="显示密码"><i data-lucide="eye"></i></button></div>
        <label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" required minlength="12" maxlength="256" autocomplete="new-password">
        <p id="password-error" class="form-error" role="alert"></p>
        <button id="password-submit" class="button primary" type="submit"><i data-lucide="check"></i>保存密码</button>
      </form>
    </section>
    <footer><span>doubao-translate2api</span><span>OpenAI · Responses · Anthropic</span></footer>
  </main>
  <dialog id="account-dialog">
    <form id="account-form">
      <div class="dialog-heading"><h2 id="account-dialog-title">导入 Cookie</h2><button type="button" class="icon-button" data-close="account-dialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <label for="account-name">账号名称</label><input id="account-name" type="text" required maxlength="64" autocomplete="off" placeholder="例如：主账号">
      <div id="cookie-fields">
        <div class="label-row"><label for="cookie-input">Cookie</label><label class="text-button file-picker"><i data-lucide="upload"></i>选择文件<input id="cookie-file" type="file" accept=".txt,.json,text/plain,application/json" hidden></label></div>
        <textarea id="cookie-input" rows="7" maxlength="131072" spellcheck="false" autocomplete="off" placeholder="sessionid=…; sid_tt=…; uid_tt=…"></textarea>
        <div class="field-meta"><span id="cookie-format">Cookie Header / JSON</span><span id="cookie-length">0 字符</span></div>
      </div>
      <p id="account-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="button" data-close="account-dialog">取消</button><button id="account-submit" class="button primary" type="submit"><i data-lucide="check"></i><span>保存</span></button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog">
    <form id="delete-form">
      <div class="dialog-heading"><h2>删除 Cookie</h2><button type="button" class="icon-button" data-close="delete-dialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <p class="delete-name" id="delete-name"></p>
      <div class="dialog-actions"><button type="button" class="button" data-close="delete-dialog">取消</button><button id="delete-submit" class="button danger" type="submit"><i data-lucide="trash-2"></i>删除</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
